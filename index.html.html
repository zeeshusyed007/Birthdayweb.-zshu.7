<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Private Birthday Wish</title>
  <link rel="stylesheet" href="assets/css/birthday.css">
</head>
<body>
  <main class="scene">
    <section class="wish">
      <h1 class="title">Happy Birthday</h1>
      <p class="subtitle">A private wish from the heart</p>
      <div class="card">
        <p class="message">May your days be filled with love, light and cinematic moments. ❤️</p>
        <audio id="bgm" src="assets/music/song.mp3" loop></audio>
        <button id="play" class="btn">Play Music</button>
      </div>
    </section>
  </main>

  <script src="assets/js/app.js"></script>
</body>
</html>
